<style>
  :root {
    --ink: #1B2430;
    --ink-soft: #3A4356;
    --paper: #F6F4EF;
    --paper-alt: #EFEAE0;
    --gold: #C08A22;
    --gold-soft: #EBD9AE;
    --berry: #A8354A;
    --berry-soft: #F1DCDF;
    --sage: #4F6B52;
    --sage-soft: #DCE6DA;
    --line: #DCD5C4;
    --radius: 16px;
    --shadow-sm: 0 2px 8px rgba(27, 36, 48, 0.04);
    --shadow-md: 0 8px 24px rgba(27, 36, 48, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .display { font-family: 'Fraunces', serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  button, input, textarea, select { font-family: inherit; }

  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* Header */
  header {
    background: var(--ink);
    padding: 24px 20px;
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .brand-icon {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .brand-title { color: var(--paper); font-size: 20px; line-height: 1.15; font-weight: 600; }
  .brand-sub { color: var(--gold-soft); font-size: 12px; margin-top: 3px; }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  .btn-back {
    color: var(--paper); background: transparent;
    border: 1px solid var(--ink-soft); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn-back:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--paper); }

  .btn-auth {
    background: var(--ink-soft); border-color: transparent;
  }
  .btn-auth:hover { background: var(--paper); color: var(--ink); }

  /* Layout */
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 80px; }

  .row-between {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    margin-bottom: 20px;
  }
  .count { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; }
  .meta-sub { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }

  .btn-primary {
    background: var(--ink); color: var(--paper); border: none;
    border-radius: 999px; padding: 10px 18px; font-size: 14px;
    cursor: pointer; font-weight: 500;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn-primary:hover { background: var(--ink-soft); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.6; cursor: wait; transform: none; }

  .btn-secondary {
    background: var(--paper-alt); color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 16px; font-size: 13px;
    cursor: pointer; font-weight: 500;
    transition: background 0.15s ease;
  }
  .btn-secondary:hover { background: var(--line); }

  /* Filtres rapides catégories */
  .filters-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .filter-pill {
    background: white; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s ease;
  }
  .filter-pill:hover { border-color: var(--ink); color: var(--ink); }
  .filter-pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* Section de catégorie */
  .category-section {
    border: 1px solid var(--line); border-radius: 20px; padding: 20px;
    margin-bottom: 24px; background: rgba(255, 255, 255, 0.25);
  }
  .category-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px; }
  .category-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; color: var(--ink); margin: 0; }
  .category-count { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); }

  /* Empty state */
  .empty {
    border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 64px 24px; text-align: center; background: rgba(255, 255, 255, 0.4);
  }
  .empty-icon { font-size: 32px; }
  .empty .display { font-size: 20px; margin: 12px 0 6px; font-weight: 600; }
  .empty p { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }

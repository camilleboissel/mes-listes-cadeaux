<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mes listes cadeaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- Ajout du module d'authentification -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
  :root {
    --ink: #1B2430;
    --ink-soft: #3A4356;
    --paper: #F6F4EF;
    --paper-alt: #EFEAE0;
    --gold: #C08A22;
    --gold-soft: #EBD9AE;
    --berry: #A8354A;
    --berry-soft: #F1DCDF;
    --sage: #4F6B52;
    --sage-soft: #DCE6DA;
    --line: #DCD5C4;
    --radius: 16px;
    --shadow-sm: 0 2px 8px rgba(27, 36, 48, 0.04);
    --shadow-md: 0 8px 24px rgba(27, 36, 48, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .display { font-family: 'Fraunces', serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  button, input, textarea, select { font-family: inherit; }

  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* Header */
  header {
    background: var(--ink);
    padding: 24px 20px;
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .brand-icon {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .brand-title { color: var(--paper); font-size: 20px; line-height: 1.15; font-weight: 600; }
  .brand-sub { color: var(--gold-soft); font-size: 12px; margin-top: 3px; }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  .btn-back {
    color: var(--paper); background: transparent;
    border: 1px solid var(--ink-soft); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn-back:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--paper); }
  
  .btn-auth {
    background: var(--ink-soft); border-color: transparent;
  }
  .btn-auth:hover { background: var(--paper); color: var(--ink); }

  /* Layout */
  main { max-width: 960px; margin: 0 auto; padding: 32px 20px 80px; }

  .row-between {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    margin-bottom: 20px;
  }
  .count { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; }
  .meta-sub { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }

  .btn-primary {
    background: var(--ink); color: var(--paper); border: none;
    border-radius: 999px; padding: 10px 18px; font-size: 14px;
    cursor: pointer; font-weight: 500;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn-primary:hover { background: var(--ink-soft); transform: translateY(-1px); }

  .btn-secondary {
    background: var(--paper-alt); color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 16px; font-size: 13px;
    cursor: pointer; font-weight: 500;
    transition: background 0.15s ease;
  }
  .btn-secondary:hover { background: var(--line); }

  /* Filtres rapides catégories */
  .filters-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .filter-pill {
    background: white; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s ease;
  }
  .filter-pill:hover { border-color: var(--ink); color: var(--ink); }
  .filter-pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* Section de catégorie (style encadré) */
  .category-section {
    border: 1px solid var(--line); border-radius: 20px; padding: 20px;
    margin-bottom: 24px; background: rgba(255, 255, 255, 0.25);
  }
  .category-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px; }
  .category-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; color: var(--ink); margin: 0; }
  .category-count { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--ink-soft); }

  /* Empty state */
  .empty {
    border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 64px 24px; text-align: center; background: rgba(255, 255, 255, 0.4);
  }
  .empty-icon { font-size: 32px; }
  .empty .display { font-size: 20px; margin: 12px 0 6px; font-weight: 600; }
  .empty p { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }

  /* Grid & Cards Listes */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }

  .card-list {
    background: white; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; cursor: pointer; position: relative; box-shadow: var(--shadow-sm);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .card-list:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--gold); }
  .swatch { width: 11px; height: 11px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .card-list .eyebrow { color: var(--ink-soft); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .card-list .name { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; margin-top: 10px; padding-right: 64px; overflow-wrap: break-word; }
  .card-list .desc { color: var(--ink-soft); font-size: 13px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .icon-btn {
    background: rgba(246, 244, 239, 0.92); border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; font-size: 13px; width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn:hover { background: var(--paper-alt); border-color: var(--ink-soft); }
  .icon-btn.del { color: var(--berry); }
  .icon-btn.del:hover { background: var(--berry-soft); border-color: var(--berry); }
  .card-list .actions-list { position: absolute; top: 14px; right: 14px; display: flex; gap: 4px; }

  /* Gift Item Cards */
  .card-item {
    background: white; border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-sm);
    cursor: pointer; transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .card-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--gold); }
  .card-item.reserved { background: #FCFBF9; }

  .card-item .photo {
    width: 100%; aspect-ratio: 4/3; background: var(--paper-alt);
    display: flex; align-items: center; justify-content: center; font-size: 32px;
    position: relative; overflow: hidden; padding: 10px;
  }
  .card-item .photo img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    border-radius: 10px; background: white;
  }
  .card-item .photo-actions {
    position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; gap: 4px;
    opacity: 0; transition: opacity 0.15s ease;
  }
  .card-item:hover .photo-actions, .card-item:focus-within .photo-actions { opacity: 1; }
  @media (hover: none) { .card-item .photo-actions { opacity: 1; } }

  .badge-priority {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    background: var(--gold-soft); color: #7C550E;
  }

  .card-item .body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
  .card-item .title { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; line-height: 1.35; overflow-wrap: break-word; }
  .card-item .price { font-family: 'IBM Plex Mono', monospace; color: var(--gold); font-size: 14px; margin-top: 5px; font-weight: 500; }
  .card-item .note { color: var(--ink-soft); font-size: 13px; margin-top: 8px; }

  .link-row { margin-top: 12px; }
  .link-btn {
    display: inline-flex; align-items: center; gap: 5px; background: var(--paper-alt); color: var(--ink);
    text-decoration: none; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 999px;
    transition: background 0.15s ease;
  }
  .link-btn:hover { background: var(--line); }

  .card-footer {
    margin-top: auto; padding-top: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .reserved-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--sage-soft); color: var(--sage); font-size: 12px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; line-height: 1.3;
  }
  .cancel-link {
    background: none; border: none; padding: 4px; color: var(--ink-soft); font-size: 12px;
    text-decoration: underline; cursor: pointer; flex-shrink: 0;
  }
  .cancel-link:hover { color: var(--berry); }
  .reserve-btn {
    background: transparent; border: 1px solid var(--sage); color: var(--sage);
    font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 999px;
    cursor: pointer; transition: all 0.15s ease;
  }
  .reserve-btn:hover { background: var(--sage-soft); }

  /* Drag & Drop Photo Zone */
  .image-upload-zone {
    border: 1px dashed var(--ink-soft); border-radius: 10px; padding: 16px;
    text-align: center; font-size: 13px; color: var(--ink-soft);
    background: var(--paper); cursor: pointer; margin-bottom: 8px;
    transition: all 0.2s ease;
  }
  .image-upload-zone.dragover { background: var(--sage-soft); border-color: var(--sage); }
  .upload-link { color: var(--sage); text-decoration: underline; cursor: pointer; }
  #imagePreview {
    display: none; max-width: 100%; max-height: 200px;
    margin: 10px auto 0; border-radius: 8px; box-shadow: var(--shadow-sm);
  }

  /* Modal */
  dialog {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); color: var(--ink);
    padding: 24px; width: min(460px, calc(100% - 32px)); box-shadow: var(--shadow-md);
  }
  dialog::backdrop { background: rgba(27, 36, 48, 0.55); backdrop-filter: blur(2px); }
  dialog h2 { margin: 0 0 16px; font-family: 'Fraunces', serif; font-size: 21px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: white; font-size: 14px; color: var(--ink);
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 13px;
    box-shadow: var(--shadow-md); opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease; z-index: 100;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 520px) {
    .header-inner { flex-direction: column; align-items: flex-start; }
    .header-actions { width: 100%; justify-content: flex-end; flex-wrap: wrap; }
    .category-section { padding: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand" id="brandHome" title="Retour aux listes">
      <div class="brand-icon">🎁</div>
      <div>
        <div class="brand-title display" id="headerTitle">Mes listes cadeaux</div>
        <div class="brand-sub" id="headerSub">Idées & envies à partager</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-back" id="btnShare" style="display:none;">🔗 Partager</button>
      <button class="btn-back btn-auth" id="btnEditorLogin">🔒 Connexion</button>
      <button class="btn-back" id="btnBack" style="display:none;">← Toutes les listes</button>
    </div>
  </div>
</header>

<main>
  <!-- VUE 1 : LISTES -->
  <section id="viewLists">
    <div class="row-between">
      <div>
        <div class="count" id="listsCount">Mes listes</div>
        <div class="meta-sub">Crée une liste par personne ou par événement</div>
      </div>
      <button class="btn-primary" id="btnNewList" style="display:none;">+ Nouvelle liste</button>
    </div>
    <div id="listsContainer"></div>
  </section>

  <!-- VUE 2 : CADEAUX D'UNE LISTE -->
  <section id="viewItems" style="display:none;">
    <div class="row-between">
      <div>
        <div class="count" id="itemsCount">0 idée</div>
        <div class="meta-sub" id="itemsSummary"></div>
      </div>
      <button class="btn-primary" id="btnNewItem" style="display:none;">+ Ajouter un cadeau</button>
    </div>
    <div class="filters-bar" id="categoryFilters" style="display:none;"></div>
    <div id="itemsContainer"></div>
  </section>
</main>

<!-- MODALE AUTHENTIFICATION -->
<dialog id="modalLogin">
  <form id="formLogin">
    <h2>Mode Éditeur</h2>
    <div class="field">
      <label for="loginEmail">Adresse e-mail</label>
      <input id="loginEmail" type="email" required placeholder="camille..." />
    </div>
    <div class="field">
      <label for="loginPass">Mot de passe</label>
      <input id="loginPass" type="password" required />
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="document.getElementById('modalLogin').close()">Annuler</button>
      <button type="submit" class="btn-primary">Se connecter</button>
    </div>
  </form>
</dialog>

<!-- MODALE LISTE -->
<dialog id="modalList">
  <form id="formList">
    <h2 id="modalListTitle">Nouvelle liste</h2>
    <input type="hidden" id="listId" />
    <div class="field">
      <label for="listOccasion">Occasion / Thème</label>
      <input id="listOccasion" placeholder="Ex. Noël 2026, Anniversaire, Naissance..." />
    </div>
    <div class="field">
      <label for="listName">Nom de la liste *</label>
      <input id="listName" required placeholder="Ex. Liste de Camille" />
    </div>
    <div class="field">
      <label for="listDesc">Description (optionnel)</label>
      <textarea id="listDesc" rows="2" placeholder="Tailles, couleurs préférées, remarques..."></textarea>
    </div>
    <div class="field">
      <label for="listColor">Couleur repère</label>
      <select id="listColor">
        <option value="#C08A22">Or</option>
        <option value="#A8354A">Bordeaux</option>
        <option value="#4F6B52">Sauge</option>
        <option value="#1B2430">Encre</option>
      </select>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="document.getElementById('modalList').close()">Annuler</button>
      <button type="submit" class="btn-primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<!-- MODALE CADEAU AVEC DROPZONE -->
<dialog id="modalItem">
  <form id="formItem">
    <h2 id="modalItemTitle">Nouveau cadeau</h2>
    <input type="hidden" id="itemId" />
    <div class="field">
      <label for="itemTitle">Nom du cadeau *</label>
      <input id="itemTitle" required placeholder="Ex. Cafetière italienne Bialetti" />
    </div>
    <div class="field">
      <label>Photo du produit</label>
      <div class="image-upload-zone" id="dropZone">
        🖼️ Colle une image (Ctrl+V), glisse-la ici, ou 
        <label class="upload-link">parcours tes fichiers<input type="file" id="fileInput" accept="image/*" style="display:none;"></label>
        <img id="imagePreview" />
      </div>
      <input type="hidden" id="itemImageBase64" />
      <input id="itemImageUrl" type="url" placeholder="Ou colle l'URL d'une image existante ici..." />
    </div>
    <div class="field">
      <label for="itemCategory">Catégorie</label>
      <input id="itemCategory" list="categoryList" placeholder="Ex. Déguisements, Poupées, Tonies, Livres..." />
      <datalist id="categoryList"></datalist>
    </div>
    <div class="field">
      <label for="itemPrice">Prix estimé (€)</label>
      <input id="itemPrice" type="text" inputmode="decimal" placeholder="Ex. 39,90" />
    </div>
    <div class="field">
      <label for="itemUrl">Lien boutique (optionnel)</label>
      <input id="itemUrl" type="url" placeholder="https://..." />
    </div>
    <div class="field">
      <label for="itemPriority">Priorité</label>
      <select id="itemPriority">
        <option value="normal">Normale</option>
        <option value="high">⭐ Coup de cœur</option>
      </select>
    </div>
    <div class="field">
      <label for="itemNote">Précisions (taille, coloris, description...)</label>
      <textarea id="itemNote" rows="2"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="document.getElementById('modalItem').close()">Annuler</button>
      <button type="submit" class="btn-primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<!-- MODALE TRANSFERT -->
<dialog id="modalTransfer">
  <form id="formTransfer">
    <h2>Déplacer le cadeau</h2>
    <div class="field">
      <label for="transferListSelect">Vers quelle liste ?</label>
      <select id="transferListSelect" required></select>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="document.getElementById('modalTransfer').close()">Annuler</button>
      <button type="submit" class="btn-primary">Déplacer</button>
    </div>
  </form>
</dialog>

<!-- MODALE RÉSERVATION -->
<dialog id="modalReserve">
  <form id="formReserve">
    <h2>Offrir ce cadeau</h2>
    <input type="hidden" id="reserveItemId" />
    <div class="field">
      <label for="reserveByName">Qui réserve ce cadeau ? *</label>
      <input id="reserveByName" required placeholder="Ex. Marraine, Tata Élise, Mamie..." />
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="document.getElementById('modalReserve').close()">Annuler</button>
      <button type="submit" class="btn-primary">Confirmer la réservation</button>
    </div>
  </form>
</dialog>

<!-- MODALE CONFIRMATION (REMPLACE ALERT/CONFIRM) -->
<dialog id="modalConfirm">
  <form method="dialog">
    <h2 style="font-size:18px;">Confirmation</h2>
    <p id="confirmMsg" style="font-size:14px; margin-bottom:20px;"></p>
    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="document.getElementById('modalConfirm').close('no')">Annuler</button>
      <button type="submit" class="btn-primary" value="yes">Confirmer</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
  // Configuration Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyB6rvuMuhHfBFnmvOipW-3zPQ-rLXKdj3I",
    authDomain: "liste-cadeaux-ad6b5.firebaseapp.com",
    projectId: "liste-cadeaux-ad6b5",
    storageBucket: "liste-cadeaux-ad6b5.firebasestorage.app",
    messagingSenderId: "67071632348",
    appId: "1:67071632348:web:87c8597c6bda3de1ece519",
    measurementId: "G-7DD51MSX4K"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  let isEditor = false;
  let currentList = null;
  let unsubscribeLists = null;
  let unsubscribeItems = null;
  let cachedLists = [];
  let cachedItems = [];
  let selectedCategory = "ALL";
  let transferItemId = null;

  // Gestion de l'authentification Éditeur
  auth.onAuthStateChanged(user => {
    isEditor = !!user; // Si un compte est connecté, on active le mode éditeur
    const btnLogin = document.getElementById('btnEditorLogin');
    
    if (isEditor) {
      btnLogin.textContent = '🔓 Mode Éditeur';
      btnLogin.title = "Déconnexion";
    } else {
      btnLogin.textContent = '🔒 Connexion';
      btnLogin.title = "Accès édition";
    }
    
    document.getElementById('btnNewList').style.display = isEditor ? 'inline-block' : 'none';
    document.getElementById('btnNewItem').style.display = isEditor ? 'inline-block' : 'none';
    
    // Rafraîchir l'affichage pour montrer ou cacher les boutons d'édition
    if (currentList) renderItems(cachedItems);
    else renderLists(cachedLists);
  });

  document.getElementById('btnEditorLogin').onclick = () => {
    if (isEditor) {
      auth.signOut();
      showToast("Mode invité activé");
    } else {
      document.getElementById('modalLogin').showModal();
    }
  };

  document.getElementById('formLogin').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPass').value;
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      document.getElementById('modalLogin').close();
      showToast("Connexion réussie !");
      document.getElementById('formLogin').reset();
    } catch (err) {
      alert("Erreur de connexion, vérifie tes accès.");
    }
  };

  // Utilitaires robustes pour l'iframe de preview
  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), 2600);
  }

  function escapeHtml(str = "") {
    return String(str).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  function safeReplaceState(url) {
    try {
      if (location.protocol !== 'blob:' && location.protocol !== 'data:') {
        history.replaceState(null, "", url);
      }
    } catch (e) { console.warn("replaceState bloqué (mode preview)"); }
  }

  function customConfirm(msg) {
    return new Promise(resolve => {
      document.getElementById('confirmMsg').textContent = msg;
      const d = document.getElementById('modalConfirm');
      d.showModal();
      d.onclose = () => resolve(d.returnValue === 'yes');
    });
  }

  // Lecture des champs
  function getItemPhoto(it) {
    return it.photo || it.image || it.photoUrl || it.imageUrl || it.img || "";
  }
  function getItemCategory(it) {
    const raw = (it.category || it.categorie || it.cat || "").trim();
    return raw ? raw.charAt(0).toUpperCase() + raw.slice(1) : "";
  }
  function getItemNote(it) {
    return it.note || it.notes || it.description || it.desc || it.details || "";
  }
  function getItemUrl(it) {
    return it.url || it.link || it.lien || "";
  }
  function getItemReservedBy(it) {
    if (typeof it.reserved === "string" && it.reserved.trim()) return it.reserved.trim();
    return (it.reservedBy || it.reservePar || it.buyer || it.offeredBy || it.takenBy || it.qui || "").trim();
  }
  function isItemReserved(it) {
    return Boolean(getItemReservedBy(it)) || it.reserved === true;
  }
  function parseNumericPrice(raw) {
    if (raw === null || raw === undefined || raw === "") return null;
    if (typeof raw === "number") return isNaN(raw) ? null : raw;
    const cleaned = String(raw).replace(/\s/g, "").replace(",", ".").replace(/[^0-9.]/g, "");
    const num = parseFloat(cleaned);
    return isNaN(num) ? null : num;
  }
  function formatItemPrice(raw) {
    if (raw === null || raw === undefined || raw === "") return "";
    const num = parseNumericPrice(raw);
    if (num !== null) return `${num.toFixed(2).replace(".", ",")} €`;
    return String(raw);
  }
  function getStoreLabel(url) {
    try {
      const host = new URL(url).hostname.replace(/^www\./, "").toLowerCase();
      if (host.includes("amazon")) return "Voir sur Amazon";
      if (host.includes("fnac")) return "Voir sur Fnac";
      if (host.includes("vinted")) return "Voir sur Vinted";
      if (host.includes("vertbaudet")) return "Voir sur Vertbaudet";
      if (host.includes("oxybul")) return "Voir sur Oxybul";
      return "Voir le site";
    } catch { return "Voir"; }
  }

  // Navigation
  function showListsView() {
    currentList = null;
    selectedCategory = "ALL";
    if (unsubscribeItems) { unsubscribeItems(); unsubscribeItems = null; }
    safeReplaceState(location.pathname);
    document.getElementById("headerTitle").textContent = "Mes listes cadeaux";
    document.getElementById("headerSub").textContent = "Idées & envies à partager";
    document.getElementById("btnBack").style.display = "none";
    document.getElementById("btnShare").style.display = "none";
    document.getElementById("viewItems").style.display = "none";
    document.getElementById("viewLists").style.display = "block";
    document.getElementById("btnNewList").style.display = isEditor ? 'inline-block' : 'none';
  }

  function openList(list) {
    currentList = list;
    selectedCategory = "ALL";
    safeReplaceState(`?list=${encodeURIComponent(list.id)}`);
    document.getElementById("headerTitle").textContent = list.name;
    document.getElementById("headerSub").textContent = list.occasion || list.category || "Liste de souhaits";
    document.getElementById("btnBack").style.display = "inline-block";
    document.getElementById("btnShare").style.display = "inline-block";
    document.getElementById("viewLists").style.display = "none";
    document.getElementById("viewItems").style.display = "block";
    document.getElementById("btnNewItem").style.display = isEditor ? 'inline-block' : 'none';
    listenItems(list.id);
  }

  document.getElementById("btnBack").onclick = showListsView;
  document.getElementById("brandHome").onclick = showListsView;
  document.getElementById("btnShare").onclick = async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      showToast("Lien copié !");
    } catch { showToast("Copie le lien en haut"); }
  };

  // Rendu Listes
  function renderLists(lists) {
    const container = document.getElementById("listsContainer");
    document.getElementById("listsCount").textContent = `${lists.length} liste${lists.length > 1 ? "s" : ""}`;

    if (!lists.length) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">✨</div>
          <div class="display">Aucune liste</div>
          <p>Commence par créer une liste d'idées.</p>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="grid">${lists.map(l => {
      const occasion = l.occasion || l.category || "Liste";
      return `
        <article class="card-list" data-id="${escapeHtml(l.id)}">
          ${isEditor ? `
          <div class="actions-list">
            <button class="icon-btn" title="Modifier" onclick="event.stopPropagation(); editList('${escapeHtml(l.id)}')">✏️</button>
            <button class="icon-btn del" title="Supprimer" onclick="event.stopPropagation(); deleteList('${escapeHtml(l.id)}')">🗑️</button>
          </div>` : ""}
          <div class="eyebrow">
            <span class="swatch" style="background:${escapeHtml(l.color || '#C08A22')}"></span>
            ${escapeHtml(occasion)}
          </div>
          <div class="name">${escapeHtml(l.name)}</div>
          ${l.desc ? `<div class="desc">${escapeHtml(l.desc)}</div>` : ""}
        </article>
      `;
    }).join("")}</div>`;

    container.querySelectorAll(".card-list").forEach(card => {
      card.onclick = () => {
        const found = lists.find(x => x.id === card.dataset.id);
        if (found) openList(found);
      };
    });
  }

  // Rendu Filtres
  function renderCategoryFilters(items) {
    const bar = document.getElementById("categoryFilters");
    const datalist = document.getElementById("categoryList");
    const catMap = new Map();
    items.forEach(it => {
      const c = getItemCategory(it);
      if (c && !catMap.has(c.toLowerCase())) catMap.set(c.toLowerCase(), c);
    });
    const categories = [...catMap.values()].sort((a, b) => a.localeCompare(b, "fr"));
    datalist.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">`).join("");

    if (categories.length < 2) { bar.style.display = "none"; return; }
    if (selectedCategory !== "ALL" && !catMap.has(selectedCategory.toLowerCase())) selectedCategory = "ALL";

    bar.style.display = "flex";
    bar.innerHTML = [
      `<button class="filter-pill ${selectedCategory === "ALL" ? "active" : ""}" data-cat="ALL">Toutes (${items.length})</button>`,
      ...categories.map(cat => {
        const count = items.filter(it => getItemCategory(it).toLowerCase() === cat.toLowerCase()).length;
        return `<button class="filter-pill ${selectedCategory.toLowerCase() === cat.toLowerCase() ? "active" : ""}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)} (${count})</button>`;
      })
    ].join("");

    bar.querySelectorAll(".filter-pill").forEach(btn => {
      btn.onclick = () => { selectedCategory = btn.dataset.cat; renderItems(cachedItems); };
    });
  }

  // Rendu Carte Cadeau
  function renderItemCard(it) {
    const photo = getItemPhoto(it);
    const priceText = formatItemPrice(it.price);
    const note = getItemNote(it);
    const url = getItemUrl(it);
    const reserved = isItemReserved(it);
    const reservedBy = getItemReservedBy(it);

    return `
      <article class="card-item ${reserved ? "reserved" : ""}" data-id="${escapeHtml(it.id)}" data-url="${escapeHtml(url)}">
        <div class="photo">
          ${photo ? `<img src="${escapeHtml(photo)}" loading="lazy">` : `<span>🎁</span>`}
          ${!reserved && it.priority === "high" ? `<span class="badge-priority">⭐ Coup de cœur</span>` : ""}
          ${isEditor ? `
          <div class="photo-actions" onclick="event.stopPropagation()">
            <button class="icon-btn" title="Déplacer" onclick="openTransferModal('${escapeHtml(it.id)}')">⇄</button>
            <button class="icon-btn" title="Modifier" onclick="editItem('${escapeHtml(it.id)}')">✏️</button>
            <button class="icon-btn del" title="Supprimer" onclick="deleteItem('${escapeHtml(it.id)}')">🗑️</button>
          </div>` : ""}
        </div>
        <div class="body">
          <div class="title">${escapeHtml(it.title)}</div>
          ${priceText ? `<div class="price">${escapeHtml(priceText)}</div>` : ""}
          ${note ? `<div class="note">${escapeHtml(note)}</div>` : ""}
          ${url ? `
            <div class="link-row" onclick="event.stopPropagation()">
              <a class="link-btn" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(getStoreLabel(url))} ↗</a>
            </div>
          ` : ""}
          <div class="card-footer" onclick="event.stopPropagation()">
            ${reserved
              ? `<span class="reserved-pill">🤝 Réservé par ${escapeHtml(reservedBy || "un proche")}</span>
                 <button type="button" class="cancel-link" onclick="handleReserveClick('${escapeHtml(it.id)}')">annuler</button>`
              : `<button type="button" class="reserve-btn" onclick="handleReserveClick('${escapeHtml(it.id)}')">Je l'offre</button>`
            }
          </div>
        </div>
      </article>
    `;
  }

  // Rendu Items
  function renderItems(items) {
    renderCategoryFilters(items);
    const filtered = selectedCategory === "ALL" ? items : items.filter(it => getItemCategory(it).toLowerCase() === selectedCategory.toLowerCase());
    const container = document.getElementById("itemsContainer");
    
    document.getElementById("itemsCount").textContent = `${filtered.length} idée${filtered.length > 1 ? "s" : ""}`;

    if (!filtered.length) {
      container.innerHTML = `<div class="empty"><div class="empty-icon">🎀</div><div class="display">Aucun cadeau ici</div></div>`;
      return;
    }

    const groupsMap = new Map();
    filtered.forEach(it => {
      const cat = getItemCategory(it) || "Autres idées";
      if (!groupsMap.has(cat.toLowerCase())) groupsMap.set(cat.toLowerCase(), { label: cat, items: [] });
      groupsMap.get(cat.toLowerCase()).items.push(it);
    });

    const groups = [...groupsMap.values()].sort((a, b) => a.label === "Autres idées" ? 1 : b.label === "Autres idées" ? -1 : a.label.localeCompare(b.label, "fr"));

    if (groups.length <= 1 && groups[0].label === "Autres idées") {
      container.innerHTML = `<div class="grid">${groups[0].items.map(renderItemCard).join("")}</div>`;
    } else {
      container.innerHTML = groups.map(group => `
        <section class="category-section">
          <div class="category-header">
            <h2 class="category-title">${escapeHtml(group.label)}</h2>
            <span class="category-count">${group.items.length}</span>
          </div>
          <div class="grid">${group.items.map(renderItemCard).join("")}</div>
        </section>
      `).join("");
    }

    container.querySelectorAll(".card-item").forEach(card => {
      card.onclick = () => {
        const url = card.dataset.url;
        if (url) window.open(url, "_blank", "noopener,noreferrer");
        else if (isEditor) editItem(card.dataset.id);
      };
    });
  }

  // Realtime Listeners
  db.collection("lists").onSnapshot(snap => {
    cachedLists = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    renderLists(cachedLists);
    const paramId = new URLSearchParams(location.search).get("list");
    if (paramId && !currentList) {
      const target = cachedLists.find(l => l.id === paramId);
      if (target) openList(target);
    }
  });

  function listenItems(listId) {
    if (unsubscribeItems) unsubscribeItems();
    unsubscribeItems = db.collection("lists").doc(listId).collection("items").onSnapshot(snap => {
      cachedItems = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      renderItems(cachedItems);
    });
  }

  // Modales Listes
  window.openListModal = (list = null) => {
    if(!isEditor) return;
    document.getElementById("modalListTitle").textContent = list ? "Modifier la liste" : "Nouvelle liste";
    document.getElementById("listId").value = list?.id || "";
    document.getElementById("listOccasion").value = list?.occasion || list?.category || "";
    document.getElementById("listName").value = list?.name || "";
    document.getElementById("listDesc").value = list?.desc || list?.description || "";
    document.getElementById("listColor").value = list?.color || "#C08A22";
    document.getElementById("modalList").showModal();
  };

  window.editList = (id) => { const l = cachedLists.find(x => x.id === id); if (l) openListModal(l); };
  window.deleteList = async (id) => {
    if (await customConfirm("Supprimer définitivement cette liste et tous ses cadeaux ?")) {
      await db.collection("lists").doc(id).delete();
      showToast("Liste supprimée");
    }
  };

  document.getElementById("formList").onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById("listId").value;
    const payload = {
      occasion: document.getElementById("listOccasion").value.trim(),
      name: document.getElementById("listName").value.trim(),
      desc: document.getElementById("listDesc").value.trim(),
      color: document.getElementById("listColor").value
    };
    if (id) await db.collection("lists").doc(id).update(payload);
    else await db.collection("lists").add({ ...payload, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    document.getElementById("modalList").close();
    showToast("Enregistré");
  };

  // Gestion des images par Collage/Glisser-Déposer
  function processImageFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 800; // Redimensionnement pour ne pas bloquer Firestore
        let w = img.width, h = img.height;
        if (w > h && w > MAX) { h *= MAX / w; w = MAX; }
        else if (h > MAX) { w *= MAX / h; h = MAX; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        
        document.getElementById('itemImageBase64').value = dataUrl;
        document.getElementById('itemImageUrl').value = ""; // Efface l'URL si on colle une image
        const preview = document.getElementById('imagePreview');
        preview.src = dataUrl;
        preview.style.display = 'block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // Écouteurs de la zone Drop/Coller
  const dropZone = document.getElementById('dropZone');
  document.getElementById('modalItem').addEventListener('paste', (e) => {
    for (const item of e.clipboardData.items) {
      if (item.type.indexOf('image') !== -1) {
        e.preventDefault();
        processImageFile(item.getAsFile());
        break;
      }
    }
  });
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    if(e.dataTransfer.files.length) processImageFile(e.dataTransfer.files[0]);
  });
  document.getElementById('fileInput').addEventListener('change', (e) => {
    if(e.target.files.length) processImageFile(e.target.files[0]);
  });
  document.getElementById('itemImageUrl').addEventListener('input', (e) => {
    if (e.target.value) {
      document.getElementById('imagePreview').style.display = 'none';
      document.getElementById('itemImageBase64').value = "";
    }
  });

  // Modales Cadeaux
  window.openItemModal = (item = null) => {
    if(!isEditor) return;
    document.getElementById("modalItemTitle").textContent = item ? "Modifier le cadeau" : "Nouveau cadeau";
    document.getElementById("itemId").value = item?.id || "";
    document.getElementById("itemTitle").value = item?.title || "";
    document.getElementById("itemCategory").value = item ? getItemCategory(item) : "";
    document.getElementById("itemPrice").value = item?.price ?? "";
    document.getElementById("itemUrl").value = item ? getItemUrl(item) : "";
    
    // Reset images
    document.getElementById("itemImageBase64").value = "";
    document.getElementById("itemImageUrl").value = "";
    document.getElementById("imagePreview").style.display = 'none';
    
    const photo = item ? getItemPhoto(item) : "";
    if (photo.startsWith("data:image")) {
      document.getElementById("itemImageBase64").value = photo;
      document.getElementById("imagePreview").src = photo;
      document.getElementById("imagePreview").style.display = 'block';
    } else {
      document.getElementById("itemImageUrl").value = photo;
    }

    document.getElementById("itemPriority").value = item?.priority || "normal";
    document.getElementById("itemNote").value = item ? getItemNote(item) : "";
    document.getElementById("modalItem").showModal();
  };

  window.editItem = (id) => { const it = cachedItems.find(x => x.id === id); if (it) openItemModal(it); };
  
  window.deleteItem = async (id) => {
    if (await customConfirm("Supprimer ce cadeau de la liste ?")) {
      await db.collection("lists").doc(currentList.id).collection("items").doc(id).delete();
      showToast("Cadeau supprimé");
    }
  };

  // Transfert d'un cadeau
  window.openTransferModal = (id) => {
    if(!isEditor) return;
    transferItemId = id;
    const select = document.getElementById("transferListSelect");
    // On affiche toutes les listes sauf l'actuelle
    const options = cachedLists
      .filter(l => l.id !== currentList.id)
      .map(l => `<option value="${escapeHtml(l.id)}">${escapeHtml(l.name)}</option>`);
    
    if (options.length === 0) return showToast("Tu n'as pas d'autre liste !");
    
    select.innerHTML = options.join("");
    document.getElementById("modalTransfer").showModal();
  };

  document.getElementById("formTransfer").onsubmit = async (e) => {
    e.preventDefault();
    const targetListId = document.getElementById("transferListSelect").value;
    const item = cachedItems.find(x => x.id === transferItemId);
    if (!item || !targetListId) return;

    // Ajoute à la nouvelle liste puis supprime de l'ancienne
    await db.collection("lists").doc(targetListId).collection("items").add({
      ...item, 
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection("lists").doc(currentList.id).collection("items").doc(transferItemId).delete();
    
    document.getElementById("modalTransfer").close();
    showToast("Cadeau déplacé !");
  };

  // Réservation
  window.handleReserveClick = async (id) => {
    if (!currentList) return;
    const it = cachedItems.find(x => x.id === id);
    if (!it) return;

    if (isItemReserved(it)) {
      const who = getItemReservedBy(it);
      if (await customConfirm(`Annuler la réservation${who ? ` de ${who}` : ""} ?`)) {
        await db.collection("lists").doc(currentList.id).collection("items").doc(id).update({
          reserved: false, reservedBy: "", reservePar: "", buyer: ""
        });
        showToast("Réservation annulée");
      }
    } else {
      document.getElementById("reserveItemId").value = id;
      document.getElementById("reserveByName").value = localStorage.getItem("gift_buyer_name") || "";
      document.getElementById("modalReserve").showModal();
    }
  };

  document.getElementById("formReserve").onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById("reserveItemId").value;
    const name = document.getElementById("reserveByName").value.trim();
    if (!name) return;
    localStorage.setItem("gift_buyer_name", name);
    await db.collection("lists").doc(currentList.id).collection("items").doc(id).update({
      reserved: true, reservedBy: name
    });
    document.getElementById("modalReserve").close();
    showToast(`Réservé par ${name} !`);
  };

  document.getElementById("formItem").onsubmit = async (e) => {
    e.preventDefault();
    const id = document.getElementById("itemId").value;
    const rawPrice = document.getElementById("itemPrice").value.trim();
    const parsedPrice = parseNumericPrice(rawPrice);
    const b64 = document.getElementById("itemImageBase64").value;
    const url = document.getElementById("itemImageUrl").value.trim();
    const finalPhoto = b64 || url;

    const payload = {
      title: document.getElementById("itemTitle").value.trim(),
      category: document.getElementById("itemCategory").value.trim(),
      price: parsedPrice !== null ? parsedPrice : rawPrice,
      url: document.getElementById("itemUrl").value.trim(),
      photo: finalPhoto,
      priority: document.getElementById("itemPriority").value,
      note: document.getElementById("itemNote").value.trim()
    };

    const col = db.collection("lists").doc(currentList.id).collection("items");
    if (id) {
      await col.doc(id).update(payload);
      showToast("Cadeau mis à jour");
    } else {
      await col.add({ ...payload, reserved: false, reservedBy: "", createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      showToast("Cadeau ajouté");
    }
    document.getElementById("modalItem").close();
  };
</script>
</body>
</html>
